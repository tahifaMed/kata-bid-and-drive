spring.application.name=bidanddrive

# PostgreSQL. Defaults match docker-compose.yml for local development.
# Override in other environments with DB_URL, DB_USERNAME and DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bidanddrive}
spring.datasource.username=${DB_USERNAME:bidanddrive}
spring.datasource.password=${DB_PASSWORD:bidanddrive}

# Flyway owns the schema. Hibernate only validates it against the entities.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
