spring.application.name=bidanddrive

# PostgreSQL. No defaults here: DB_URL, DB_USERNAME and DB_PASSWORD must be set.
# The app fails fast at startup if they are missing. Local defaults live in the
# "local" profile (application-local.properties), which is opt-in only.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema. Hibernate only validates it against the entities.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Auction end time window, measured from now (ADR 0008). Both bounds are inclusive.
bidanddrive.auction.min-duration=PT1H
bidanddrive.auction.max-duration=P30D
